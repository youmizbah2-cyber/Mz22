<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Master Control Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #94a3b8; }
        input[type="text"], textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        textarea { resize: vertical; height: 60px; }
        .status-toggle { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 15px; border-radius: 6px; }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ef4444; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(22px); }
        button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0284c7; color: white; }
        .msg { text-align: center; font-size: 13px; color: #4ade80; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>App Control Panel</h2>
    
    <!-- ১. অ্যাপ চালু বা বন্ধ -->
    <div class="form-group status-toggle">
        <span>অ্যাপ স্ট্যাটাস (ON/OFF):</span>
        <label class="switch">
            <input type="checkbox" id="app_status" checked>
            <span class="slider"></span>
        </label>
    </div>

    <!-- ২. বাধ্যতামূলক আপডেট -->
    <div class="form-group status-toggle">
        <span>বাধ্যতামূলক আপডেট (Force Update):</span>
        <label class="switch">
            <input type="checkbox" id="force_update">
            <span class="slider"></span>
        </label>
    </div>

    <!-- ৩. সর্বশেষ ভার্সন -->
    <div class="form-group">
        <label>সর্বশেষ আপডেট ভার্সন:</label>
        <input type="text" id="app_version" value="1.0.0">
    </div>

    <!-- ৪. APK ডাউনলোড লিংক -->
    <div class="form-group">
        <label>APK ডাউনলোড লিংক:</label>
        <input type="text" id="apk_link" placeholder="ডাউনলোড লিংক দিন">
    </div>

    <!-- ৫. এডমিন পপ-আপ মেসেজ -->
    <div class="form-group">
        <label>এডমিন পপ-আপ নোটিশ/মেসেজ:</label>
        <textarea id="popup_msg" placeholder="অ্যাপে দেখানোর জন্য নোটিশ লিখুন"></textarea>
    </div>

    <button onclick="saveConfig()">সেটিংস সেভ করুন</button>
    <div class="msg" id="msg"></div>
</div>

<script>
    window.onload = function() {
        if(localStorage.getItem('config')) {
            let cfg = JSON.parse(localStorage.getItem('config'));
            document.getElementById('app_status').checked = cfg.app_active;
            document.getElementById('force_update').checked = cfg.force_update;
            document.getElementById('app_version').value = cfg.version;
            document.getElementById('apk_link').value = cfg.apk_url;
            document.getElementById('popup_msg').value = cfg.popup_message;
        }
    }

    function saveConfig() {
        let config = {
            app_active: document.getElementById('app_status').checked,
            force_update: document.getElementById('force_update').checked,
            version: document.getElementById('app_version').value,
            apk_url: document.getElementById('apk_link').value,
            popup_message: document.getElementById('popup_msg').value
        };

        localStorage.setItem('config', JSON.stringify(config));
        document.getElementById('msg').innerText = 'সেটিংস সফলভাবে সেভ হয়েছে!';
    }
</script>

</body>
</html>
