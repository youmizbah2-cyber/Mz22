<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Remote Control Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #94a3b8; }
        input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        .status-toggle { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 15px; border-radius: 6px; }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ef4444; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(22px); }
        button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0284c7; color: white; }
        .msg { text-align: center; font-size: 13px; color: #4ade80; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>App Master Control</h2>
    
    <!-- ১. অ্যাপ চালু বা বন্ধ করার সুইচ -->
    <div class="form-group status-toggle">
        <span>অ্যাপ স্ট্যাটাস (ON/OFF):</span>
        <label class="switch">
            <input type="checkbox" id="app_status" checked>
            <span class="slider"></span>
        </label>
    </div>

    <!-- ২. সর্বশেষ ভার্সন -->
    <div class="form-group">
        <label>সর্বশেষ আপডেট ভার্সন:</label>
        <input type="text" id="app_version" value="1.0.0">
    </div>

    <!-- ৩. APK ডাউনলোড লিংক -->
    <div class="form-group">
        <label>APK ডাউনলোড লিংক:</label>
        <input type="text" id="apk_link" placeholder="এখানে সরাসরি APK লিংক দিন">
    </div>

    <button onclick="saveConfig()">সেটিংস সেভ করুন</button>
    <div class="msg" id="msg"></div>
</div>

<script>
    // পেজ লোড হলে আগের সেভ করা ডেটা দেখাবে
    window.onload = function() {
        if(localStorage.getItem('app_active') !== null) {
            document.getElementById('app_status').checked = (localStorage.getItem('app_active') === 'true');
        }
        if(localStorage.getItem('app_version')) {
            document.getElementById('app_version').value = localStorage.getItem('app_version');
        }
        if(localStorage.getItem('apk_link')) {
            document.getElementById('apk_link').value = localStorage.getItem('apk_link');
        }
    }

    function saveConfig() {
        var isActive = document.getElementById('app_status').checked;
        var version = document.getElementById('app_version').value;
        var link = document.getElementById('apk_link').value;

        // ব্রাউজারে সেভ করা (যা অ্যাপ রিড করবে)
        localStorage.setItem('app_active', isActive);
        localStorage.setItem('app_version', version);
        localStorage.setItem('apk_link', link);

        document.getElementById('msg').innerText = 'রিমোট সেটিংস সফলভাবে আপডেট হয়েছে!';
    }
</script>

</body>
</html>
